<header class="adm__top wrap">
  <a class="brand" href="index.html"><svg viewBox="0 0 301.71 169.67"><use href="#wordmark"/></svg></a>
  <span class="label">Anfragen</span>
  <button class="textlink" id="logoutBtn" hidden>Abmelden</button>
</header>

<main class="wrap">
  <!-- Login -->
  <section class="adm__login theme-dark" id="loginView" hidden>
    <form id="loginForm" novalidate>
      <h1 class="display-3">Anmelden</h1>
      <div class="field"><input type="text" id="lUser" name="user" placeholder=" " autocomplete="username" required><label for="lUser">Benutzername</label></div>
      <div class="field"><input type="password" id="lPass" name="password" placeholder=" " autocomplete="current-password" required><label for="lPass">Passwort</label></div>
      <div class="form__foot"><button class="btn" type="submit">Anmelden <svg class="arr"><use href="#arrow"/></svg></button><div class="form__msg" id="loginMsg"></div></div>
    </form>
  </section>

  <!-- Liste -->
  <section id="listView" hidden>
    <div class="adm__bar">
      <div class="filter"><span class="filter__label">Quelle</span>
        <div class="seg" id="sourceSeg"><button class="is-on" data-value="">Alle</button><button data-value="finder">Wohnungsfinder</button><button data-value="coming-soon">Vormerkungen</button></div>
      </div>
      <div class="filter adm__search"><span class="filter__label">Suche</span><input type="search" id="search" placeholder="Name, E-Mail, Top, Nachricht"></div>
      <div class="adm__actions">
        <span class="filter__result" id="count"></span>
        <a class="btn" id="csvBtn" href="api/admin/export">CSV herunterladen <svg class="arr"><use href="#arrow"/></svg></a>
      </div>
    </div>
    <div class="adm__tablewrap">
      <table class="units adm__table" id="inqTable">
        <thead><tr><th>Datum</th><th>Quelle</th><th>Top</th><th>Name</th><th>E-Mail</th><th>Telefon</th><th>Status</th><th></th></tr></thead>
        <tbody id="inqBody"></tbody>
      </table>
    </div>
    <p class="adm__hint muted body-s" id="listMsg"></p>
  </section>
</main>
